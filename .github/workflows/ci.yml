name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Run default project only (excludes quality test)
      - run: npx playwright test --project=chromium
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  security:
    name: Security Scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config auto app/ components/ lib/ middleware.ts --quiet

  # Gate job — aggregates all checks into a single required status.
  # When branch protection is enabled, require only this job:
  #   Settings → Branches → main → Require status checks → "CI Gate"
  #
  # To enable branch protection (requires GitHub Pro or public repo):
  #   gh api repos/OWNER/REPO/branches/main/protection \
  #     --method PUT \
  #     -f 'required_status_checks[strict]=true' \
  #     -f 'required_status_checks[contexts][]=CI Gate' \
  #     -f 'enforce_admins=true' \
  #     -F 'required_pull_request_reviews[required_approving_review_count]=0' \
  #     -F 'restrictions=null'
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, audit, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.e2e.result }}" != "success" ]] ||
             [[ "${{ needs.audit.result }}" != "success" ]] ||
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more CI jobs failed:"
            echo "  lint:     ${{ needs.lint.result }}"
            echo "  test:     ${{ needs.test.result }}"
            echo "  e2e:      ${{ needs.e2e.result }}"
            echo "  audit:    ${{ needs.audit.result }}"
            echo "  security: ${{ needs.security.result }}"
            exit 1
          fi
          echo "All CI checks passed."
